<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>7M Hub</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#14161f">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14161f; --panel:#1b1e2a; --raise:#262a3a; --line:#313650;
  --text:#e8eaf3; --dim:#9399b5; --accent:#ffb454; --accent-ink:#2a1a00;
  --ok:#4ade80; --bad:#f2555a;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:"Bricolage Grotesque",system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* entrada */
#login{height:100%;display:grid;place-items:center;padding:24px}
#login form{width:min(380px,100%);display:grid;gap:14px}
#login h1{font-size:44px;font-weight:700;letter-spacing:-.03em}
#login p{color:var(--dim);margin-bottom:6px}
#login input{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:16px}
.primary{background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:10px;padding:14px}

/* app */
#app{display:none;height:100%;grid-template-columns:240px 1fr 300px;grid-template-rows:1fr}
#app.on{display:grid}
aside{background:var(--panel);padding:16px 12px;display:flex;flex-direction:column;gap:6px;overflow:auto}
aside h2{font-size:13px;color:var(--dim);font-weight:500;padding:8px 8px 4px}
.chan{display:flex;gap:8px;align-items:center;text-align:left;background:none;padding:9px 10px;border-radius:8px;color:var(--dim)}
.chan:hover{background:var(--raise);color:var(--text)}
.chan.on{background:var(--raise);color:var(--text);box-shadow:inset 3px 0 var(--accent)}
.people{list-style:none;padding:2px 0 8px 22px;display:grid;gap:4px;font-size:14px}
.people li{display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}

.people li.talk .av{box-shadow:0 0 0 2px var(--ok)}
.people .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.people input[type=range]{width:64px;margin-left:auto;accent-color:var(--accent)}
.av{width:22px;height:22px;border-radius:50%;object-fit:cover;background:var(--line);display:grid;place-items:center;font-size:12px;flex:none}
#avatarPick{width:96px;height:96px;border-radius:50%;background:var(--panel);border:1px dashed var(--line);display:grid;place-items:center;cursor:pointer;overflow:hidden;position:relative;font-size:12px;color:var(--dim);text-align:center}
#avatarPick img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
#avatarPick.has img{display:block} #avatarPick.has span{display:none}
.ctl{position:absolute;right:10px;bottom:10px;display:flex;gap:8px;align-items:center;background:#000b;padding:6px 10px;border-radius:8px;opacity:0;transition:opacity .15s}
.tile:hover .ctl,.tile:focus-within .ctl{opacity:1}
@media (hover:none){.ctl{opacity:1}}
.ctl button{background:var(--raise);padding:4px 10px;border-radius:6px;font-size:13px}
.ctl input{width:110px;accent-color:var(--accent)}
.chk{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:14px}
main{display:flex;flex-direction:column;min-width:0}
#stage{flex:1;padding:16px;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));grid-auto-rows:minmax(180px,1fr);overflow:auto}
#empty{margin:auto;color:var(--dim);text-align:center;max-width:320px;line-height:1.5}
.tile{position:relative;background:#000;border-radius:12px;overflow:hidden;min-height:0}
.tile video{width:100%;height:100%;object-fit:contain;background:#000}
.tile span{position:absolute;left:10px;bottom:10px;background:#000b;padding:4px 10px;border-radius:6px;font-size:13px}
.tile:fullscreen{border-radius:0}
#bar{display:flex;gap:10px;justify-content:center;padding:14px;background:var(--panel);border-top:1px solid var(--line)}
#bar button{background:var(--raise);padding:12px 18px;border-radius:10px;font-weight:500}
#bar button:hover{background:var(--line)}
#bar button.off{background:var(--bad);color:#fff}
#bar button.live{background:var(--accent);color:var(--accent-ink)}
#bar .leave{background:#5a2328}
#chat{display:flex;flex-direction:column;gap:8px;border-left:1px solid var(--line)}
#log{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;font-size:14px;line-height:1.4;word-break:break-word}
#log b{color:var(--accent)} #log i{color:var(--dim);font-style:normal}
#chat input{background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:12px}
#chatRow{display:flex;gap:6px}
#chatRow #chatInput{flex:1;min-width:0}
#btnAttach{background:var(--raise);border-radius:10px;padding:0 14px;font-size:18px}
.msg{display:flex;gap:8px;align-items:flex-start}
.msg .body{min-width:0}
.msg .who{font-weight:700;color:var(--accent)}
.msg .time{color:var(--dim);font-size:12px;margin-left:6px}
.att{max-width:100%;max-height:220px;border-radius:8px;display:block;margin-top:4px;cursor:zoom-in}
.att:fullscreen{max-width:none;max-height:none;width:100%;height:100%;object-fit:contain;background:#000}
a.file{display:inline-block;margin-top:4px;background:var(--raise);padding:6px 10px;border-radius:8px;color:var(--text);text-decoration:none;font-size:13px}
.badge{margin-left:auto;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:0 7px;font-size:12px;font-weight:700}
#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--bad);padding:10px 16px;border-radius:8px;display:none}

@media (max-width:900px){
  #app{grid-template-columns:1fr;grid-template-rows:auto 1fr 200px}
  aside:first-of-type{flex-direction:row;overflow:auto;align-items:center}
  aside:first-of-type h2,.people{display:none}
  #stage{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){ .dot{transition:box-shadow .15s} }
</style>
</head>
<body>

<div id="login">
  <form id="loginForm">
    <h1>7M Hub</h1>
    <p>Call e transmissão de tela para a turma. Escolha um nome e entre.</p>
    <label id="avatarPick" title="Escolher foto"><img id="avatarImg" alt=""><span>Sua foto</span><input id="avatarFile" type="file" accept="image/*" hidden></label>
    <input id="nameInput" placeholder="Seu nome" maxlength="24" required autofocus>
    <button class="primary">Entrar</button>
  </form>
</div>

<div id="app">
  <aside>
    <h2>Canais de texto</h2>
    <div id="texts"></div>
    <h2>Canais de voz</h2>
    <div id="channels"></div>
  </aside>

  <main>
    <div id="stage"><p id="empty">Você está sozinho aqui. Chame alguém para o mesmo canal ou comece a transmitir sua tela.</p></div>
    <div id="bar">
      <button id="btnMic">Microfone</button>
      <button id="btnNoise">Ruído</button>
      <button id="btnDeaf">Áudio</button>
      <button id="btnShare">Compartilhar tela</button>
      <label class="chk"><input type="checkbox" id="shareAudio" checked> Incluir som</label>
      <button id="btnLeave" class="leave">Sair</button>
    </div>
  </main>

  <aside id="chat">
    <h2 id="chatTitle"></h2>
    <div id="log"></div>
    <div id="chatRow"><button id="btnAttach" title="Anexar arquivo">+</button><input id="chatInput" placeholder="Mensagem" maxlength="1000" autocomplete="off"><input id="fileInput" type="file" hidden></div>
  </aside>
</div>
<div id="toast" role="alert"></div>

<script>
const CHANNELS = ['Geral', 'Jogos', 'Filmes', 'Estudo'];
const ICE = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] };

const $ = (id) => document.getElementById(id);
// O app de desktop (Electron) ainda não consegue capturar o som só de uma janela.
const IN_APP = navigator.userAgent.includes('Electron');
let ws, myId, myName, room = null;
let micStream = null, screenStream = null;
let muted = false, deafened = false;
const peers = new Map(); // id -> {id,name,pc,polite,makingOffer,ignoreOffer,screenSenders,tiles}

/* ---------- util ---------- */
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => (t.style.display = 'none'), 4000);
}
const sig = (to, data) => ws.send(JSON.stringify({ type: 'signal', to, data }));

/* ---------- entrada ---------- */
$('loginForm').onsubmit = async (e) => {
  e.preventDefault();
  myName = $('nameInput').value.trim(); if (!myName) return;
  localStorage.setItem('resenha:nome', myName); localStorage.setItem('resenha:avatar', myAvatar);
  $('login').style.display = 'none'; $('app').classList.add('on');
  audioCtx ||= new AudioContext(); audioCtx.resume();
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  } catch { toast('Sem acesso ao microfone. Você vai só ouvir.'); }
  applyNoise(); connect();
};
$('nameInput').value = localStorage.getItem('resenha:nome') || '';
if (IN_APP && !window.hubAudio) {
  $('shareAudio').checked = false; $('shareAudio').disabled = true;
  $('shareAudio').parentElement.lastChild.textContent = ' Som (atualize o app)';
}
let myAvatar = localStorage.getItem('resenha:avatar') || '';
function showAvatar() {
  if (myAvatar) $('avatarImg').src = myAvatar; else $('avatarImg').removeAttribute('src');
  $('avatarPick').classList.toggle('has', !!myAvatar);
}
$('avatarFile').onchange = (e) => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas'); c.width = c.height = 96;
    const sz = Math.min(img.width, img.height);
    c.getContext('2d').drawImage(img, (img.width - sz) / 2, (img.height - sz) / 2, sz, sz, 0, 0, 96, 96);
    myAvatar = c.toDataURL('image/jpeg', 0.8); showAvatar(); URL.revokeObjectURL(img.src);
  };
  img.src = URL.createObjectURL(f);
};
showAvatar();

function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  ws.onopen = () => { joinRoom(room || CHANNELS[0]); openText(textChannel); };
  ws.onmessage = (e) => onServer(JSON.parse(e.data));
  ws.onclose = () => { toast('Conexão perdida. Reconectando...'); setTimeout(connect, 2000); };
}

function joinRoom(name) {
  closeAllPeers(); room = name;
  ws.send(JSON.stringify({ type: 'join', room: name, name: myName, avatar: myAvatar }));
  renderChannels(); updateEmpty();
  if (screenStream) $('btnShare').classList.add('live');
}

let presenceRooms = {};
function avatarEl(u) {
  const el = document.createElement(u.avatar ? 'img' : 'span');
  el.className = 'av';
  if (u.avatar) el.src = u.avatar; else el.textContent = (u.name || '?')[0].toUpperCase();
  return el;
}
const loadVol = (name) => { const v = parseFloat(localStorage.getItem('resenha:vol:' + name)); return isNaN(v) ? 1 : v; };
function applyVol(t) {
  t.querySelector('video').volume = t.dataset.screen === '1' ? (t.screenVol ?? 1) : t.peer.vol;
}
function renderChannels() {
  const box = $('channels'); box.textContent = '';
  for (const c of CHANNELS) {
    const b = document.createElement('button');
    b.className = 'chan' + (c === room ? ' on' : ''); b.textContent = '🔊 ' + c; b.style.width = '100%';
    b.onclick = () => c !== room && joinRoom(c);
    box.append(b);
    const list = presenceRooms[c] || [];
    if (!list.length) continue;
    const ul = document.createElement('ul'); ul.className = 'people';
    for (const u of list) {
      const li = document.createElement('li'); li.dataset.id = u.id;
      const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = u.id === myId ? u.name + ' (você)' : u.name;
      li.append(avatarEl(u), nm);
      const p = peers.get(u.id);
      if (c === room && p) {
        const r = document.createElement('input'); r.type = 'range'; r.min = 0; r.max = 100; r.value = Math.round(p.vol * 100);
        r.title = 'Volume de ' + p.name;
        r.oninput = () => { p.vol = r.value / 100; localStorage.setItem('resenha:vol:' + p.name, p.vol); p.tiles.forEach(applyVol); };
        li.append(r);
      }
      ul.append(li);
    }
    box.append(ul);
  }
}

/* ---------- mensagens do servidor ---------- */
function onServer(m) {
  if (m.type === 'joined') {
    myId = m.id; sfx('join');
    m.peers.forEach((p) => createPeer(p.id, p.name, p.avatar));
    updateEmpty();
  } else if (m.type === 'peer-joined') {
    createPeer(m.id, m.name, m.avatar); sfx('join'); updateEmpty();
  } else if (m.type === 'peer-left') {
    if (peers.has(m.id)) { closePeer(m.id); sfx('leave'); }
    updateEmpty();
  } else if (m.type === 'signal') onSignal(m.from, m.data);
  else if (m.type === 'presence') { presenceRooms = m.rooms; renderChannels(); }
  else if (m.type === 'history' && m.channel === textChannel) { $('log').textContent = ''; m.msgs.forEach(renderMsg); }
  else if (m.type === 'text') {
    if (m.channel === textChannel) renderMsg(m.msg);
    else { unread[m.channel] = (unread[m.channel] || 0) + 1; renderTexts(); }
  }
}

/* ---------- WebRTC (negociação perfeita) ---------- */
function createPeer(id, name, avatar) {
  if (peers.has(id)) return;
  const pc = new RTCPeerConnection(ICE);
  const p = { id, name, avatar, vol: loadVol(name), pc, polite: myId > id, makingOffer: false, ignoreOffer: false, screenSenders: [], tiles: new Map() };
  peers.set(id, p);

  pc.onnegotiationneeded = async () => {
    try { p.makingOffer = true; await pc.setLocalDescription(); sig(id, { description: pc.localDescription }); }
    catch (e) { console.error(e); } finally { p.makingOffer = false; }
  };
  pc.onicecandidate = (e) => e.candidate && sig(id, { candidate: e.candidate });
  pc.oniceconnectionstatechange = () => pc.iceConnectionState === 'failed' && pc.restartIce();
  pc.ontrack = (e) => showRemote(p, e.streams[0], e.track);

  micStream?.getTracks().forEach((t) => pc.addTrack(t, micStream));
  if (screenStream) addScreenTo(p);
}

async function onSignal(from, { description, candidate }) {
  const p = peers.get(from); if (!p) return;
  const pc = p.pc;
  try {
    if (description) {
      const collision = description.type === 'offer' && (p.makingOffer || pc.signalingState !== 'stable');
      p.ignoreOffer = !p.polite && collision;
      if (p.ignoreOffer) return;
      await pc.setRemoteDescription(description);
      if (description.type === 'offer') { await pc.setLocalDescription(); sig(from, { description: pc.localDescription }); }
    } else if (candidate) {
      try { await pc.addIceCandidate(candidate); } catch (e) { if (!p.ignoreOffer) throw e; }
    }
  } catch (e) { console.error(e); }
}

function closePeer(id) {
  const p = peers.get(id); if (!p) return;
  p.tiles.forEach((t) => t.remove()); p.pc.close(); peers.delete(id);
}
function closeAllPeers() { [...peers.keys()].forEach(closePeer); }

/* ---------- vídeo/áudio remoto ---------- */
/* sons: entrar (sobe), sair (desce), transmissão (3 notas brilhantes) */
function sfx(kind) {
  if (deafened) return;
  try {
    audioCtx ||= new AudioContext(); audioCtx.resume?.();
    const seq = {
      join: [[660, 0], [880, .11]],
      leave: [[880, 0], [520, .11]],
      share: [[523, 0], [659, .09], [784, .18]],
      shareStop: [[784, 0], [523, .1]],
    }[kind];
    const t0 = audioCtx.currentTime;
    for (const [f, d] of seq) {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = kind.startsWith('share') ? 'triangle' : 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + d);
      g.gain.exponentialRampToValueAtTime(0.18, t0 + d + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 0.16);
      o.connect(g).connect(audioCtx.destination); o.start(t0 + d); o.stop(t0 + d + 0.18);
    }
  } catch {}
}
/* Som da transmissão no app: o Windows entrega o som do programa (ou da tela, sem o 7M Hub)
   e aqui ele vira uma faixa de áudio para ir junto com a imagem. */
function toStereoFloat(u8, meta) {
  const raw = u8.slice().buffer; // cópia alinhada
  let src;
  if (meta.isFloat && meta.bitsPerSample === 32) src = new Float32Array(raw);
  else if (!meta.isFloat && meta.bitsPerSample === 16) src = Float32Array.from(new Int16Array(raw), (v) => v / 32768);
  else if (!meta.isFloat && meta.bitsPerSample === 32) src = Float32Array.from(new Int32Array(raw), (v) => v / 2147483648);
  else return null;
  const ch = meta.channels || 2;
  if (ch === 2) return src;
  const out = new Float32Array((src.length / ch) * 2);
  for (let i = 0, j = 0; i < src.length; i += ch) { out[j++] = src[i]; out[j++] = src[ch > 1 ? i + 1 : i]; }
  return out;
}
async function startAppAudio() {
  try {
    const ctx = new AudioContext({ sampleRate: 48000 });
    const code = `class P extends AudioWorkletProcessor {
      constructor() { super(); this.q = []; this.cur = null; this.pos = 0;
        this.port.onmessage = (e) => { this.q.push(e.data); if (this.q.length > 60) this.q.splice(0, this.q.length - 20); }; }
      process(_i, outputs) {
        const L = outputs[0][0], R = outputs[0][1] || outputs[0][0];
        for (let i = 0; i < L.length; i++) {
          if (!this.cur || this.pos >= this.cur.length) { this.cur = this.q.shift() || null; this.pos = 0; }
          if (!this.cur) { L[i] = 0; R[i] = 0; continue; }
          L[i] = this.cur[this.pos++]; R[i] = this.cur[this.pos++];
        }
        return true;
      } }
      registerProcessor('pcm-player', P);`;
    await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([code], { type: 'text/javascript' })));
    const node = new AudioWorkletNode(ctx, 'pcm-player', { numberOfInputs: 0, outputChannelCount: [2] });
    const dest = ctx.createMediaStreamDestination(); node.connect(dest);
    hubAudio.onChunk((u8, meta) => { try { const f = toStereoFloat(u8, meta); if (f) node.port.postMessage(f, [f.buffer]); } catch {} });
    hubAudio.onStatus((m) => toast('Transmitindo sem som: ' + m));
    return { track: dest.stream.getAudioTracks()[0], close: () => { hubAudio.stop(); hubAudio.onChunk(null); ctx.close(); } };
  } catch { toast('Não consegui preparar o som da transmissão.'); return null; }
}
function controls(tile, onVol) {
  const c = document.createElement('div'); c.className = 'ctl';
  if (onVol) {
    const r = document.createElement('input'); r.type = 'range'; r.min = 0; r.max = 100; r.value = 100; r.title = 'Volume da transmissão';
    r.oninput = () => onVol(r.value / 100); c.append(r);
  }
  const f = document.createElement('button'); f.textContent = 'Tela cheia';
  f.onclick = () => (document.fullscreenElement ? document.exitFullscreen() : tile.requestFullscreen?.());
  c.append(f); return c;
}
function showRemote(p, stream, track) {
  let tile = p.tiles.get(stream.id);
  if (!tile) {
    tile = document.createElement('div'); tile.className = 'tile'; tile.style.display = 'none'; tile.peer = p;
    const v = document.createElement('video'); v.autoplay = true; v.playsInline = true; v.srcObject = stream; v.muted = deafened;
    const label = document.createElement('span'); label.textContent = p.name;
    tile.append(v, label, controls(tile, (val) => { tile.screenVol = val; applyVol(tile); }));
    $('stage').append(tile); p.tiles.set(stream.id, tile);
    if (!stream.getVideoTracks().length) watchSpeaking(p, stream);
  }
  tile.dataset.screen = stream.getVideoTracks().length ? '1' : '0';
  applyVol(tile);
  if (track.kind === 'video') {
    const sync = () => {
      const show = !track.muted && track.readyState !== 'ended', was = tile.style.display !== 'none';
      if (show && !was) sfx('share'); if (!show && was) sfx('shareStop');
      tile.style.display = show ? '' : 'none'; updateEmpty();
    };
    track.onmute = sync; track.onunmute = sync; track.onended = sync; sync();
    tile.querySelector('span').textContent = p.name + ' (tela)';
  }
}

function updateEmpty() {
  const any = [...$('stage').children].some((c) => c.classList.contains('tile') && c.style.display !== 'none');
  $('empty').style.display = any ? 'none' : '';
}

/* indicador de quem está falando */
let audioCtx;
function watchSpeaking(p, stream, isMe) {
  if (!stream.getAudioTracks().length) return;
  audioCtx ||= new AudioContext();
  const an = audioCtx.createAnalyser(); an.fftSize = 256;
  audioCtx.createMediaStreamSource(stream).connect(an);
  const buf = new Uint8Array(an.frequencyBinCount);
  const id = isMe ? myId : p.id;
  const tick = () => {
    if (!isMe && !peers.has(p.id)) return;
    an.getByteFrequencyData(buf);
    const level = buf.reduce((a, b) => a + b, 0) / buf.length;
    document.querySelector(`#channels li[data-id="${id}"]`)?.classList.toggle('talk', level > 18 && !(isMe && muted));
    setTimeout(tick, 120);
  };
  tick();
}

/* ---------- controles ---------- */
let noiseOn = localStorage.getItem('resenha:ruido') !== '0';
async function applyNoise() {
  $('btnNoise').textContent = noiseOn ? 'Ruído: cancelado' : 'Ruído: normal';
  $('btnNoise').classList.toggle('live', noiseOn);
  try {
    await micStream?.getAudioTracks()[0]?.applyConstraints({ noiseSuppression: noiseOn, echoCancellation: true, autoGainControl: true, voiceIsolation: noiseOn });
  } catch {}
}
$('btnNoise').onclick = () => { noiseOn = !noiseOn; localStorage.setItem('resenha:ruido', noiseOn ? '1' : '0'); applyNoise(); };
$('btnMic').onclick = () => {
  if (!micStream) return toast('Microfone indisponível.');
  muted = !muted; micStream.getAudioTracks().forEach((t) => (t.enabled = !muted));
  $('btnMic').classList.toggle('off', muted); $('btnMic').textContent = muted ? 'Microfone mudo' : 'Microfone';
};
$('btnDeaf').onclick = () => {
  deafened = !deafened;
  peers.forEach((p) => p.tiles.forEach((t) => (t.querySelector('video').muted = deafened)));
  $('btnDeaf').classList.toggle('off', deafened); $('btnDeaf').textContent = deafened ? 'Áudio desligado' : 'Áudio';
};
$('btnLeave').onclick = () => { ws.onclose = null; ws.close(); stopShare(); micStream?.getTracks().forEach((t) => t.stop()); location.reload(); };

$('btnShare').onclick = async () => {
  if (screenStream) return stopShare();
  if (!navigator.mediaDevices?.getDisplayMedia) return toast('Seu navegador não permite compartilhar tela (precisa de HTTPS).');
  let appAudio = null;
  try {
    const wantAudio = $('shareAudio').checked && !$('shareAudio').disabled;
    if (IN_APP && window.hubAudio) { hubAudio.setWant(wantAudio); if (wantAudio) appAudio = await startAppAudio(); }
    // Janela: só o som daquela janela. Tela inteira: som do computador.
    screenStream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 30 },
      audio: !IN_APP && wantAudio && { echoCancellation: true, noiseSuppression: false, autoGainControl: false, restrictOwnAudio: true },
      windowAudio: 'window', systemAudio: 'include' });
  } catch { appAudio?.close(); return; }
  if (appAudio) { screenStream.addTrack(appAudio.track); screenStream.appAudio = appAudio; }
  screenStream.getVideoTracks()[0].onended = stopShare;
  peers.forEach(addScreenTo);
  const tile = document.createElement('div'); tile.className = 'tile'; tile.id = 'localShare';
  const v = document.createElement('video'); v.autoplay = true; v.muted = true; v.playsInline = true; v.srcObject = screenStream;
  const l = document.createElement('span'); l.textContent = 'Sua tela';
  tile.append(v, l, controls(tile)); tile.ondblclick = () => tile.requestFullscreen?.(); $('stage').append(tile);
  $('btnShare').classList.add('live'); $('btnShare').textContent = 'Parar transmissão'; sfx('share'); updateEmpty();
};
function addScreenTo(p) { p.screenSenders = screenStream.getTracks().map((t) => p.pc.addTrack(t, screenStream)); }
function stopShare() {
  if (!screenStream) return;
  screenStream.appAudio?.close();
  screenStream.getTracks().forEach((t) => t.stop());
  peers.forEach((p) => { p.screenSenders.forEach((s) => { try { p.pc.removeTrack(s); } catch {} }); p.screenSenders = []; });
  screenStream = null; $('localShare')?.remove();
  $('btnShare').classList.remove('live'); $('btnShare').textContent = 'Compartilhar tela'; sfx('shareStop'); updateEmpty();
}

/* ---------- chat de texto (separado da voz) ---------- */
const TEXTS = ['geral', 'memes', 'jogos', 'estudo'];
let textChannel = localStorage.getItem('resenha:texto');
if (!TEXTS.includes(textChannel)) textChannel = TEXTS[0];
const unread = {};

function renderTexts() {
  const box = $('texts'); box.textContent = '';
  for (const c of TEXTS) {
    const b = document.createElement('button');
    b.className = 'chan' + (c === textChannel ? ' on' : ''); b.textContent = '# ' + c; b.style.width = '100%';
    if (unread[c]) { const n = document.createElement('span'); n.className = 'badge'; n.textContent = unread[c]; b.append(n); }
    b.onclick = () => c !== textChannel && openText(c);
    box.append(b);
  }
}
function openText(c) {
  textChannel = c; unread[c] = 0; localStorage.setItem('resenha:texto', c);
  $('log').textContent = ''; $('chatTitle').textContent = '# ' + c;
  ws.send(JSON.stringify({ type: 'history-req', channel: c }));
  renderTexts();
}
function fileEl(f) {
  if (f.expired) { const e = document.createElement('i'); e.textContent = `(${f.name}: anexo expirado)`; return e; }
  let el;
  if (f.type.startsWith('image/')) { el = new Image(); el.src = f.data; el.className = 'att'; el.onclick = () => el.requestFullscreen?.(); }
  else if (f.type.startsWith('video/')) { el = document.createElement('video'); el.src = f.data; el.controls = true; el.className = 'att'; }
  else if (f.type.startsWith('audio/')) { el = document.createElement('audio'); el.src = f.data; el.controls = true; }
  else { el = document.createElement('a'); el.href = f.data; el.download = f.name; el.className = 'file'; el.textContent = '📎 ' + f.name; }
  return el;
}
function renderMsg(m) {
  const d = document.createElement('div'); d.className = 'msg';
  const body = document.createElement('div'); body.className = 'body';
  const who = document.createElement('span'); who.className = 'who'; who.textContent = m.name;
  const tm = document.createElement('span'); tm.className = 'time';
  tm.textContent = new Date(m.ts).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  body.append(who, tm);
  if (m.text) { const t = document.createElement('div'); t.textContent = m.text; body.append(t); }
  if (m.file) body.append(fileEl(m.file));
  d.append(avatarEl(m), body); $('log').append(d); $('log').scrollTop = 1e9;
}
function sendText(text, file) {
  if (!text && !file) return;
  ws.send(JSON.stringify({ type: 'text', channel: textChannel, text, file }));
}
function sendFile(f) {
  if (!f) return;
  if (f.size > 5 * 1024 * 1024) return toast('Arquivo grande demais (máximo 5 MB).');
  const r = new FileReader();
  r.onload = () => {
    sendText($('chatInput').value.trim(), { name: f.name || 'imagem.png', type: f.type || 'application/octet-stream', data: r.result });
    $('chatInput').value = '';
  };
  r.readAsDataURL(f);
}
$('btnAttach').onclick = () => $('fileInput').click();
$('fileInput').onchange = (e) => { sendFile(e.target.files[0]); e.target.value = ''; };
$('chatInput').onkeydown = (e) => {
  if (e.key !== 'Enter' || !e.target.value.trim()) return;
  sendText(e.target.value.trim()); e.target.value = '';
};
$('chatInput').onpaste = (e) => { const f = e.clipboardData.files[0]; if (f) { e.preventDefault(); sendFile(f); } };

/* meu próprio indicador de fala (depois que o mic liga) */
const waitMic = setInterval(() => { if (micStream && myId) { clearInterval(waitMic); watchSpeaking(null, micStream, true); } }, 500);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
</script>
